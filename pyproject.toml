[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perfectcode"
version = "0.1.0"
description = "Zero-Issues Super-Fast Fully-Automated Perfect Code"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
vector = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]
openai = [
    "openai>=1.30",
]
anthropic = [
    "anthropic>=0.25",
]

[tool.setuptools.packages.find]
include = ["perfectcode*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
